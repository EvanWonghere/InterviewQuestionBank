name: Deploy Quiz to Hugo

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    env:
      API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CONCEPT_LAB_URL: ${{ vars.VITE_CONCEPT_LAB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and unit tests
        run: npm run lint && npm test

      - name: Build
        run: npm run build

      - name: Push dist to Hugo repository
        uses: cpina/github-action-push-to-another-repository@main
        with:
          source-directory: 'dist'
          destination-github-username: 'EvanWonghere'
          destination-repository-name: 'EvanWonghere.github.io'
          target-directory: 'static/quiz'
          target-branch: 'main'
          user-name: 'github-actions[bot]'
          user-email: 'github-actions[bot]@users.noreply.github.com'
